
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Blender Model</title>
    <style>
        body {
            margin: 0;
            background: #202838;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            padding: 12px;
        }

        #viewer {
            width: 100%;
            height: 80vh;
        }
    </style>
</head>
<body>
    <h1>My 3D Blender Model</h1>
    <div id="viewer"></div>

    <script type="module">
        import * as THREE from
          'https://unpkg.com/three@0.160.0/build/three.module.js';

        import { OrbitControls } from
          'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';

        import { GLTFLoader } from
          'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

        const container = document.getElementById('viewer');

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x202838);

        const camera = new THREE.PerspectiveCamera(
            45, container.clientWidth / container.clientHeight, 0.1, 1000
        );
        camera.position.set(4, 3, 6);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        scene.add(new THREE.HemisphereLight(0xffffff, 0x555566, 2));

        const light = new THREE.DirectionalLight(0xffffff, 3);
        light.position.set(5, 8, 5);
        scene.add(light);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const loader = new GLTFLoader();

        loader.load(
            './my_model.glb',
            function (gltf) {
                scene.add(gltf.scene);
            },
            undefined,
            function (error) {
                console.error('Model loading failed:', error);
            }
        );

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(
                container.clientWidth, container.clientHeight
            );
        });
    </script>
</body>
</html>
